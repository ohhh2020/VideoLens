# 所有 paths 相对 VIDEOLENS_RUNTIME_ROOT 指定的独立运行目录。密钥仅存运行目录 config/user_settings.json。
app:
  name: zhiying
  version: 0.1.0
  root: .
paths:
  data: data
  models: models
  videos: data/videos
  audio: data/audio
  frames: data/frames
  temp: data/temp
  sqlite: data/zhiying.db
  chroma: data/chroma
  logs: logs
  exports: data/exports
models:
  config_file: configs/models.yaml
  device: cpu
  max_loaded_models: 3
  keep_loaded: true
  cpu_threads: 4
  auto_download: false
media:
  audio_sample_rate: 16000
  audio_channels: 1
  audio_codec: pcm_s16le
  audio_format: wav
  ffmpeg_timeout_ms: 1800000
  ffprobe_timeout_ms: 30000
  download:
    format_max_height: 720
    max_retries: 3
    backoff_base: 2.0
    backoff_max: 60.0
    socket_timeout_s: 30.0
    retries_per_fragment: 10
    concurrent_fragments: 4
    resume: true
    cookies_from_browser: null
    max_url_length: 2048
  scene_detect:
    detector: content
    threshold: 27.0
    min_scene_len_ms: 1200
    frame_skip: 0
    candidate_cap: 6
    frames_per_scene: 2
    min_frames_per_scene: 1
    blur_threshold: 60.0
    drop_blurry: false
    dedupe_frames: true
    dedupe_max_diff: 1.5
    dedupe_color_distance: 30.0
    dedupe_probe_side: 64
    dedupe_grid: 4
    long_video_min_ms: 300000
    long_video_frame_skip: 2
    long_video_downscale: 4
    long_video_use_ffmpeg: true
    long_video_hwaccel: true
    long_video_detect_width: 480
    keyframe:
      min_short_side: 720
      max_jpeg_bytes: 204800
      jpeg_quality_min: 55
      jpeg_quality_max: 92
      jpeg_subsampling: 2
      format: jpg
    max_workers: 4
    ffmpeg_threads: 2
    keep_probe_dir: false
asr:
  model: faster-whisper-small
  device: cpu
  compute_type: int8
  beam_size: 5
  cpu_threads: 4
  num_workers: 1
  batch_size: 4
  language: null
  vad_filter: true
  vad_min_silence_ms: 500
  subtitle_priority:
  - srt
  - vtt
  - ass
  - ssa
  fallback_to_subtitle: true
  min_language_probability: 0.5
vl:
  max_new_tokens: 512
  temperature: 0.1
  max_image_side: 1280
  prompt_key: keyframe_describe
  max_retries: 2
  batch_size: 1
  sequence_frames: 2
  sequence_temperature: 0.1
  sequence_mode: true
  video_mode: auto
  video_segment_max_s: 15
  video_segment_budget: 40
  high_motion_density_per_min: 20.0
  high_motion_scene_span_ms: 10000
  cloud_enabled: true
  cloud_model: ''
  cloud_sequence_frames: 8
  cloud_workers: 8
embedding:
  text_model: bge-m3
  image_model: siglip2-base
  text_device: null
  image_device: null
  gpu_batch_size: 4
  text_dim: 1024
  image_dim: 768
  batch_size: 16
  normalize: true
  max_text_chars: 8192
retrieval:
  backend: chroma
  top_k: 6
  fetch_multiplier: 4
  rrf_k: 60
  weights:
    text: 1.0
    image: 0.8
    bm25: 0.6
  min_score: 0.05
  channel_timeout_ms: 3000
  max_clip_chars: 1000
  include_keyframes: true
  bm25:
    k1: 1.5
    b: 0.75
    tokenizer: jieba
    stopwords:
    - 的
    - 了
    - 是
    - 在
    - 和
    - 也
    - 就
    - 都
    - 而
    - 及
    - 与
chunk:
  min_ms: 10000
  max_ms: 30000
  target_ms: 20000
  overlap_ms: 1500
  silence_ms: 600
  weight_tail_penalty: 0.6
  hard_split_ms: 30000
  max_chars: 1000
llm:
  mode: cloud
  cloud:
    base_url: ''
    model: ''
    api_key_env: OPENAI_API_KEY
    timeout_s: 60
    max_retries: 2
    max_concurrency: 4
    temperature: 0.3
    max_tokens: 2048
storage:
  sqlite:
    journal_mode: WAL
    busy_timeout_ms: 5000
    pool_size: 4
  chroma:
    clip_collection: clip_text
    frame_collection: frame_image
    metric: cosine
    verify_dim: true
  limits:
    max_videos: 200
    max_clips: 50000
    max_transcript_segments: 500000
    max_keyframes: 100000
    max_keyframe_bytes: 21474836480
    max_text_vectors: 50000
    max_image_vectors: 100000
    max_result_bytes: 5368709120
    max_artifacts: 5000
  retention:
    temp_hours: 24
    orphan_frames_days: 30
    video_ttl_days: 0
    auto_prune: true
api:
  host: 127.0.0.1
  port: 8000
  max_body_bytes: 4294967296
  sse_heartbeat_s: 15
  request_timeout_s: 300
report:
  polish_transcript: true
  milestones_max_per_chapter: 5
  polish_block_chars: 4000
qa:
  multi_turn: true
  query_rewrite: true
  query_rewrite_mode: context
  query_rewrite_timeout_s: 4.0
  history_window: 8
limits:
  max_url_length: 2048
  max_duration_ms: 7200000
  max_file_bytes: 4294967296
  max_question_chars: 500
  max_report_chars: 5000
  min_keyframe_short_side: 720
  timestamp_tolerance_ms: 1000
  keyframe_tolerance_ms: 100
  citation_tolerance_ms: 2000
  inference_serial: false
  pipeline_parallel: true
targets:
  parse_1h_cpu_ms: 1800000
  parse_1h_gpu_ms: 600000
  asr_1h_cpu_ms: 2400000
  asr_1h_gpu_ms: 600000
  qa_first_response_ms: 10000
  qa_first_token_ms: 3000
  ui_response_ms: 200
  zh_cer_max: 0.15
  en_wer_max: 0.2
logging:
  level: INFO
  format: '[%(asctime)s][%(levelname)s][%(task)s]: %(message)s'
  color: auto
  date_format: '%Y-%m-%d %H:%M:%S'
  # 每次启动创建 YYYY-MM-DD-CNT.log，同日序号从 1 递增，不覆盖旧文件。
  directory: logs
  redact_keys:
  - api_key
  - token
  - password
  - secret
  - authorization
  - cookie
  local_mode_strict: true

ui:
  report_mode: user

memory:
  file: data/memory/preferences.json
  max_items: 200
  max_text_chars: 220
  top_k: 4
  min_similarity: 0.35
  # 视频报告对所有类别（包括表达风格）都要求与本片证据相关。
  report_min_similarity: 0.55
  dedupe_similarity: 0.92
  history_limit: 200
  batch_size: 24
