# 三个必需本地模型；使用 Hugging Face 协议及可配置镜像下载。
version: 1
cache:
  root: models
  partial_dirname: .partial
  manifest_name: manifest.json
  partial_retention_hours: 24
network:
  sources_order:
  - huggingface
  timeout: 60
  etag_timeout: 30
  retries: 4
  backoff_base: 2.0
  backoff_max: 45.0
  backoff_jitter: 0.35
  progress_interval: 0.4
  max_workers: 4
  hf_endpoint: https://hf-mirror.com
  modelscope_endpoint: null
  hf_offline: false
  show_progress: true
  verify_sha256: false
defaults:
  revision: main
models:
  bge-m3:
    kind: text-embedding
    required: true
    license: MIT
    description: BAAI/bge-m3，中英多语检索向量（1024 维），同时供 BM25 词表构建
    size_hint_gb: 2.3
    targets:
      text_embedding: bge-m3
    sources:
      huggingface:
        repo_id: BAAI/bge-m3
        revision: main
    ignore_patterns:
    - '*.md'
    - '*.png'
    - '*.jpg'
    - onnx/*
    - '*.onnx'
    - .gitattributes
    required_files:
    - config.json
    - tokenizer.json
    - pytorch_model.bin
    allow_patterns:
    - '*.json'
    - pytorch_model.bin
    - sentencepiece.bpe.model
  faster-whisper-small:
    kind: asr
    required: true
    license: MIT
    description: 必需的本地语音识别模型；禁止缺失降级
    size_hint_gb: 0.5
    targets:
      asr: faster-whisper
    sources:
      huggingface:
        repo_id: guillaumekln/faster-whisper-small
        revision: main
    ignore_patterns:
    - '*.md'
    - '*.png'
    - '*.jpg'
    - '*.jpeg'
    - .gitattributes
    required_files:
    - config.json
    - model.bin
    - tokenizer.json
    - vocabulary.*
  siglip2-base:
    kind: image-embedding
    required: true
    license: Apache-2.0
    description: google/siglip2-base-patch16-224，图文对齐向量，用于关键帧以文搜图
    size_hint_gb: 1.6
    targets:
      image_embedding: siglip2
    sources:
      huggingface:
        repo_id: google/siglip2-base-patch16-224
        revision: main
    ignore_patterns:
    - '*.md'
    - '*.png'
    - '*.jpg'
    - '*.gif'
    - .gitattributes
    required_files:
    - config.json
    - preprocessor_config.json
    - '*.safetensors'
    - tokenizer.json
    - tokenizer.model
    allow_patterns:
    - '*.json'
    - '*.safetensors'
    - tokenizer.model
