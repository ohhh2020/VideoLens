<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知影 · 视频对话</title>
<link rel="stylesheet" href="/assets/chat/style.css">
<link rel="stylesheet" href="/assets/shared/markdown.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <a class="back-analysis" href="/ui" aria-label="返回视频分析">← 返回视频分析</a>
      <h1><a href="/chat">知影 · 视频对话</a></h1>
      <p class="sub">选中视频即可对内容追问</p>
      <p class="sub" style="margin-top:4px;display:flex;gap:10px">
        <a id="newSession" style="color:var(--accent);cursor:pointer">＋新会话</a>
        <a id="exportChat" style="color:var(--accent);cursor:pointer">导出 Markdown</a>
        <a id="clearChat" style="color:var(--muted);cursor:pointer">清空对话</a>
      </p>
    </header>
    <div id="vlist"><div class="empty">加载中…</div></div>
    <div id="sessWrap" style="border-top:1px solid var(--border);padding:8px 0;display:none">
      <div style="padding:4px 16px;color:var(--muted);font-size:11px;font-weight:600">历史会话</div>
      <div id="sessList"></div>
    </div>
  </aside>

  <main id="main">
    <div id="stage">
      <video id="player" controls preload="metadata"></video>
      <div id="playerbar"><span id="nowplaying">未选择视频</span><span id="clock"></span></div>
    </div>
    <div id="flow"><div class="empty" id="placeholder">从左侧选择一个视频开始提问<br>
      <span style="font-size:12px">回答带 <code>[n]</code> 引用，点击可跳转到对应画面</span></div></div>
    <div id="inputbar">
      <div id="inputrow">
        <textarea id="q" rows="1" placeholder="对视频内容提问，Enter 发送（Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
        <button id="stop">停止</button>
      </div>
      <div id="hint"><span id="multiturn">多轮上下文：开</span><span>回答由云端模型生成 · 引用可核对</span></div>
    </div>
  </main>
</div>

<script src="/assets/vendor/marked.umd.js" defer></script>
<script src="/assets/vendor/purify.min.js" defer></script>
<script src="/assets/shared/markdown.js" defer></script>
<script src="/assets/chat/stream.js" defer></script>
<script src="/assets/chat/app.js" defer></script>
</body>
</html>
