[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videolens"
version = "0.1.0"
description = "知影：本地视频分析、检索与带证据问答助手"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "gradio>=5.20,<7", "python-multipart>=0.0.20",
  "keyring>=25,<27", "yt-dlp>=2025.1", "pysubs2>=1.8,<2",
  "Pillow>=11,<13", "jieba>=0.42.1", "numpy>=2.1,<3",
  "huggingface-hub>=0.30,<2", "psutil>=6,<8", "filelock>=3.16,<5",
]

[project.optional-dependencies]
heavy = [
  "chromadb>=1.0,<2", "sentence-transformers>=4,<7",
  "transformers>=4.51,<6", "torch>=2.7,<3", "faster-whisper>=1.1,<2",
]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
videolens = "videolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: 使用本地 FFmpeg 的集成测试",
  "real_model: 需要已下载的真实模型",
  "cloud: 需要用户配置云端凭据",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
