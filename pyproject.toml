[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# 知影 ZhiYing —— 本地优先的视频智能分析助手
#
#   pip install -e ".[dev]"          # 开发：CPU 降级也能跑通全链路
#   pip install -e ".[cuda,llm]"     # 生产：GPU + GGUF 本地大模型
# =============================================================================

[project]
name = "zhiying"
version = "0.1.0"
description = "知影 ZhiYing：本地优先的视频智能分析助手（转写 / 视觉 / 检索 / 问答）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["video", "asr", "rag", "multimodal", "local-first", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 运行期核心依赖：与 requirements.txt 保持一致，二者改动需同步。
# 注意：openai / markdown / aiofiles / python-dotenv / requests 曾在这里挂名
# 但全仓没有 import（LLM/VL 走 httpx/urllib，dotenv 由 core.config 自带解析），
# 已删除 —— 声明不用的依赖比缺依赖更误导人。
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "gradio>=4.44.0",
    "gradio-client>=1.3.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.66.4",
    "httpx>=0.27.0",
    "huggingface_hub>=0.24.0",
    "modelscope>=1.16.0",
    "filelock>=3.15.4",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0,<3.0",
    "scenedetect>=0.6.4",
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.3.1",
    "av>=12.0.0",
    "yt-dlp>=2024.8.6",
    "jieba>=0.42.1",
    "chromadb>=0.5.5",
]

[project.scripts]
# 装完即得 `zhiying` 命令（README 与 CLI epilog 都按它教学）。
zhiying = "clients.cli:main"

[project.optional-dependencies]
# 推理底座：体积大、且与平台强相关，拆成 extras 让用户按需装。
torch = ["torch>=2.3.0"]
embed = ["transformers>=4.44.0", "torch>=2.3.0"]          # BGE-M3 / SigLIP2
asr = ["faster-whisper>=1.0.3", "ctranslate2>=4.3.1"]    # 已在核心依赖，单独给瘦装用户
llm = ["llama-cpp-python>=0.2.90"]                       # Qwen2.5 GGUF 本地推理
cpu = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "llama-cpp-python>=0.2.90",
]
cuda = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "llama-cpp-python>=0.2.90",
    "accelerate>=0.33.0",
]
# 注意：没有 mcp extra —— MCP 是手写 JSON-RPC（api/mcp_server.py），
# 不依赖官方 SDK，声明它只会误导。
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]
all = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "llama-cpp-python>=0.2.90",
    "accelerate>=0.33.0",
]

# 本仓库有 scripts/ 与 examples/ 两个非包目录，不能靠自动发现。
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "clients*"]
exclude = ["tests*", "scripts*", "examples*", "models*", "data*", ".tmp_test*"]

[tool.setuptools.package-data]
"core" = ["py.typed"]

# -----------------------------------------------------------------------------
# 工具链
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models", "data", ".tmp_test", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "TID"]
ignore = [
    "E501",    # 行长交给 formatter，中文注释容易超
    "B008",    # FastAPI 的 Depends()/File() 默认参数是惯用法
    "ARG002",  # 协议实现里用不到的参数必须保留签名
    "SIM108",  # 三元表达式不总是更清楚
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]          # 门面文件 re-export
"tests/*" = ["ARG001", "ARG002", "S101"]
".tmp_test/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true       # cv2 / jieba / scenedetect / llama_cpp 无类型桩
exclude = ["models/", "data/", "\\.tmp_test/", "examples/"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "gradio.*", "modelscope.*", "faster_whisper.*", "llama_cpp.*"]
ignore_missing_imports = true

# 注意：没有 [tool.pytest.ini_options] —— 测试是零 pytest 的自检脚本
# （tests/run_all.py，文件顶层直接执行断言），pytest 收集反而会在
# import 期触发它们。要跑测试：python tests/run_all.py

[tool.coverage.run]
source = ["core", "api", "clients"]
omit = ["*/__init__.py", "models/*", ".tmp_test/*"]
